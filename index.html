<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>약물 특성 조회</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#667085; --line:#e4e7ec; --accent:#2f6fde; --warn:#b54708; --danger:#b42318; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151b; --card:#1b1f27; --text:#e6e9ef; --muted:#98a2b3; --line:#2c323d; --accent:#6c9cff; --warn:#f79009; --danger:#f97066; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif; line-height:1.5; }
  main { max-width:880px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:.9rem; margin:0 0 20px; }
  form { display:flex; gap:8px; }
  input { flex:1; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--text); font-size:1rem; }
  button { padding:10px 18px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-size:1rem; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-top:16px; }
  .card h2 { font-size:1.05rem; margin:0 0 12px; }
  .head { display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  .head img { width:140px; height:140px; background:#fff; border-radius:8px; border:1px solid var(--line); }
  dl { display:grid; grid-template-columns:max-content 1fr; gap:6px 16px; margin:0; }
  dt { color:var(--muted); }
  dd { margin:0; word-break:break-word; }
  .src { margin-top:12px; font-size:.85rem; color:var(--muted); }
  .src a { color:var(--accent); word-break:break-all; }
  .signal { display:inline-block; padding:2px 10px; border-radius:999px; font-weight:600; font-size:.85rem; }
  .signal.Warning { color:var(--warn); border:1px solid var(--warn); }
  .signal.Danger { color:var(--danger); border:1px solid var(--danger); }
  ul { margin:6px 0; padding-left:20px; }
  .picto img { width:44px; height:44px; margin-right:4px; }
  .block { border-top:1px solid var(--line); padding-top:12px; margin-top:12px; }
  .block:first-of-type { border-top:0; margin-top:0; padding-top:0; }
  .err { color:var(--danger); }
  .muted { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>약물 특성 조회</h1>
  <p class="sub">PubChem 공식 API(PUG REST · PUG View)로 조회합니다. 영문명 입력을 권장합니다 (예: ibuprofen).</p>
  <form id="f">
    <input id="q" placeholder="약물 이름 (예: ibuprofen, acetaminophen)" value="ibuprofen" required>
    <button id="btn">조회</button>
  </form>
  <div id="out"></div>
</main>

<script>
const REST = "https://pubchem.ncbi.nlm.nih.gov/rest/pug";
const VIEW = "https://pubchem.ncbi.nlm.nih.gov/rest/pug_view";

// 초당 5회 제한: 요청 시작 간격을 최소 220ms로 직렬화
let lastCall = 0, chain = Promise.resolve();
function throttledFetch(url) {
  const run = async () => {
    const wait = Math.max(0, lastCall + 220 - Date.now());
    if (wait) await new Promise(r => setTimeout(r, wait));
    lastCall = Date.now();
    const res = await fetch(url);
    if (res.status === 404) return null;
    if (!res.ok) throw new Error(`HTTP ${res.status} — ${url}`);
    return res.json();
  };
  const p = chain.then(run, run);
  chain = p.catch(() => {});
  return p;
}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const link = u => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`;

const PROPS = [
  ["IUPACName","IUPAC 이름"], ["MolecularFormula","분자식"], ["MolecularWeight","분자량 (g/mol)"],
  ["ExactMass","정확 질량"], ["XLogP","XLogP"], ["TPSA","TPSA (Å²)"],
  ["HBondDonorCount","수소결합 공여체"], ["HBondAcceptorCount","수소결합 수용체"],
  ["RotatableBondCount","회전 가능 결합"], ["Charge","전하"],
  ["ConnectivitySMILES","SMILES"], ["InChIKey","InChIKey"],
];

async function lookup(name) {
  const cidUrl = `${REST}/compound/name/${encodeURIComponent(name)}/cids/JSON`;
  const cidData = await throttledFetch(cidUrl);
  const cid = cidData?.IdentifierList?.CID?.[0];
  if (!cid) throw new Error(`"${name}"에 해당하는 화합물을 찾지 못했습니다.`);

  const propUrl = `${REST}/compound/cid/${cid}/property/${PROPS.map(p => p[0]).join(",")}/JSON`;
  const ghsUrl = `${VIEW}/data/compound/${cid}/JSON?heading=GHS+Classification`;
  const [propData, ghsData] = await Promise.all([throttledFetch(propUrl), throttledFetch(ghsUrl)]);
  return { cid, cidUrl, propUrl, ghsUrl, props: propData?.PropertyTable?.Properties?.[0] || {}, ghs: ghsData };
}

function parseGHS(data) {
  if (!data?.Record) return [];
  const refs = Object.fromEntries((data.Record.Reference || []).map(r => [r.ReferenceNumber, r]));
  const groups = {};
  (function walk(sec) {
    for (const info of sec.Information || []) {
      const g = groups[info.ReferenceNumber] ||= { ref: refs[info.ReferenceNumber] || {}, items: {} };
      const swm = info.Value?.StringWithMarkup || [];
      if (info.Name === "Pictogram(s)") {
        g.items.pictos = swm.flatMap(s => (s.Markup || []).filter(m => m.Type === "Icon").map(m => ({ url: m.URL, label: m.Extra })));
      } else {
        g.items[info.Name] = swm.map(s => s.String).filter(Boolean);
      }
    }
    (sec.Section || []).forEach(walk);
  })(data.Record);
  return Object.values(groups);
}

function render(r) {
  const p = r.props;
  const rows = PROPS.filter(([k]) => p[k] !== undefined && p[k] !== "")
    .map(([k, label]) => `<dt>${label}</dt><dd>${esc(p[k])}</dd>`).join("");
  const img = `${REST}/compound/cid/${r.cid}/PNG?image_size=300x300`;
  const page = `https://pubchem.ncbi.nlm.nih.gov/compound/${r.cid}`;

  const ghs = parseGHS(r.ghs);
  const ghsHtml = ghs.length ? ghs.map(g => {
    const it = g.items, signal = it["Signal"]?.[0];
    const list = (key, title) => it[key]?.length ? `<div><strong>${title}</strong><ul>${it[key].map(s => `<li>${esc(s)}</li>`).join("")}</ul></div>` : "";
    return `<div class="block">
      <div><strong>${esc(g.ref.SourceName || "출처 미상")}</strong> ${signal ? `<span class="signal ${esc(signal)}">${esc(signal)}</span>` : ""}</div>
      ${it.pictos?.length ? `<div class="picto">${it.pictos.map(x => `<img src="${esc(x.url)}" alt="${esc(x.label)}" title="${esc(x.label)}">`).join("")}</div>` : ""}
      ${list("GHS Hazard Statements", "유해·위험 문구")}
      ${list("Precautionary Statement Codes", "예방조치 코드")}
      ${list("ECHA C&L Notifications Summary", "ECHA 신고 요약")}
      ${g.ref.URL ? `<div class="src">기관 출처: ${link(g.ref.URL)}</div>` : ""}
    </div>`;
  }).join("") : `<p class="muted">PubChem에 GHS 분류 정보가 없습니다.</p>`;

  out.innerHTML = `
    <div class="card">
      <div class="head">
        <img src="${img}" alt="구조식">
        <div><h2 style="margin:0">${esc(q.value)} <span class="muted">· CID ${r.cid}</span></h2>
        <a href="${page}" target="_blank" rel="noopener">PubChem에서 보기 ↗</a></div>
      </div>
    </div>
    <div class="card"><h2>물리화학적 특성</h2><dl>${rows}</dl>
      <div class="src">출처 (PUG REST): ${link(r.propUrl)}</div></div>
    <div class="card"><h2>GHS 분류</h2>${ghsHtml}
      <div class="src">출처 (PUG View): ${link(r.ghsUrl)}<br>CID 조회: ${link(r.cidUrl)}<br>
      웹 페이지: ${link(page + "#section=GHS-Classification")}</div></div>`;
}

const f = document.getElementById("f"), q = document.getElementById("q"),
      btn = document.getElementById("btn"), out = document.getElementById("out");
f.addEventListener("submit", async e => {
  e.preventDefault();
  btn.disabled = true; out.innerHTML = `<div class="card muted">조회 중…</div>`;
  try { render(await lookup(q.value.trim())); }
  catch (err) { out.innerHTML = `<div class="card err">오류: ${esc(err.message)}</div>`; }
  finally { btn.disabled = false; }
});
</script>
</body>
</html>
